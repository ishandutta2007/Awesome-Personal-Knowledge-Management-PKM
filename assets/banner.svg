<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0b1120" />
    </linearGradient>

    <radialGradient id="glow-violet" cx="30%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glow-cyan" cx="75%" cy="65%" r="60%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#818cf8" />
      <stop offset="70%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <linearGradient id="card-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.5" />
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.6" />
    </filter>

    <filter id="glow-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes pulseSlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(1.08); }
      }
      @keyframes floatSlow1 {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-10px) rotate(1deg); }
      }
      @keyframes floatSlow2 {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(12px) rotate(-1.5deg); }
      }
      @keyframes floatSlow3 {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes dashAnim {
        to { stroke-dashoffset: -40; }
      }
      @keyframes nodeGlow {
        0%, 100% { r: 5; opacity: 0.7; }
        50% { r: 7.5; opacity: 1; }
      }

      .node-pulse-1 { animation: nodeGlow 4s ease-in-out infinite; }
      .node-pulse-2 { animation: nodeGlow 4s ease-in-out infinite 2s; }
      .flow-line {
        stroke-dasharray: 6, 6;
        animation: dashAnim 8s linear infinite;
      }
      .flow-line-rev {
        stroke-dasharray: 5, 5;
        animation: dashAnim 6s linear infinite reverse;
      }
      .floating-pill-1 { animation: floatSlow1 6s ease-in-out infinite; }
      .floating-pill-2 { animation: floatSlow2 7s ease-in-out infinite; }
      .floating-pill-3 { animation: floatSlow3 5s ease-in-out infinite; }
      .bg-pulse { animation: pulseSlow 8s ease-in-out infinite; transform-origin: center; }

      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        letter-spacing: -0.02em;
      }
      .sub-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
        letter-spacing: 0.01em;
      }
      .badge-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="380" rx="16" fill="url(#bg-grad)" />

  <!-- Ambient Pulsing Glow Orbs -->
  <circle cx="320" cy="180" r="280" fill="url(#glow-violet)" class="bg-pulse" />
  <circle cx="880" cy="200" r="260" fill="url(#glow-cyan)" class="bg-pulse" />

  <!-- Background Grid Dots -->
  <g opacity="0.18">
    <pattern id="dot-pattern" x="0" y="0" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#94a3b8" />
    </pattern>
    <rect width="1200" height="380" rx="16" fill="url(#dot-pattern)" />
  </g>

  <!-- Background Graph Network Connections (Layered Behind Text) -->
  <g opacity="0.45">
    <!-- Left constellation -->
    <path d="M 80 120 L 190 70 L 140 190 L 80 280 L 190 250 L 260 160 Z" fill="none" stroke="#6366f1" stroke-width="1.2" class="flow-line" />
    <path d="M 140 190 L 260 160" fill="none" stroke="#38bdf8" stroke-width="1.2" class="flow-line-rev" />
    <circle cx="80" cy="120" r="5" fill="#818cf8" class="node-pulse-1" />
    <circle cx="190" cy="70" r="6" fill="#38bdf8" class="node-pulse-2" />
    <circle cx="140" cy="190" r="5" fill="#a855f7" class="node-pulse-1" />
    <circle cx="80" cy="280" r="4.5" fill="#06b6d4" class="node-pulse-2" />
    <circle cx="190" cy="250" r="5" fill="#ec4899" class="node-pulse-1" />
    <circle cx="260" cy="160" r="6" fill="#6366f1" class="node-pulse-2" />

    <!-- Right constellation -->
    <path d="M 940 140 L 1020 60 L 1110 130 L 1050 230 L 960 270 L 1030 330" fill="none" stroke="#a855f7" stroke-width="1.2" class="flow-line" />
    <path d="M 1020 60 L 1050 230" fill="none" stroke="#06b6d4" stroke-width="1.2" class="flow-line-rev" />
    <circle cx="940" cy="140" r="5" fill="#38bdf8" class="node-pulse-1" />
    <circle cx="1020" cy="60" r="6" fill="#c084fc" class="node-pulse-2" />
    <circle cx="1110" cy="130" r="5.5" fill="#f472b6" class="node-pulse-1" />
    <circle cx="1050" cy="230" r="6" fill="#818cf8" class="node-pulse-2" />
    <circle cx="960" cy="270" r="5" fill="#34d399" class="node-pulse-1" />
    <circle cx="1030" cy="330" r="4.5" fill="#38bdf8" class="node-pulse-2" />
  </g>

  <!-- Ambient Floating Category Tags (Positioned at Edges, Not Obscuring Center) -->
  <g class="floating-pill-1">
    <rect x="70" y="310" width="130" height="34" rx="17" fill="#1e293b" fill-opacity="0.8" stroke="#3b82f6" stroke-opacity="0.5" stroke-width="1" />
    <text x="135" y="332" fill="#93c5fd" text-anchor="middle" class="badge-text">🔒 Local-First</text>
  </g>

  <g class="floating-pill-2">
    <rect x="990" y="30" width="150" height="34" rx="17" fill="#1e293b" fill-opacity="0.8" stroke="#a855f7" stroke-opacity="0.5" stroke-width="1" />
    <text x="1065" y="52" fill="#d8b4fe" text-anchor="middle" class="badge-text">🕸️ Knowledge Graph</text>
  </g>

  <g class="floating-pill-3">
    <rect x="1000" y="315" width="140" height="34" rx="17" fill="#1e293b" fill-opacity="0.8" stroke="#10b981" stroke-opacity="0.5" stroke-width="1" />
    <text x="1070" y="337" fill="#6ee7b7" text-anchor="middle" class="badge-text">⚡ Self-Hosted</text>
  </g>

  <g class="floating-pill-2">
    <rect x="65" y="35" width="140" height="34" rx="17" fill="#1e293b" fill-opacity="0.8" stroke="#ec4899" stroke-opacity="0.5" stroke-width="1" />
    <text x="135" y="57" fill="#fbcfe8" text-anchor="middle" class="badge-text">🧠 Second Brain</text>
  </g>

  <!-- FOREGROUND CONTAINER: Centered Content Protected from Background/Floating Overlaps -->
  <g filter="url(#shadow)">
    <!-- Central Content Shield/Backdrop -->
    <rect x="230" y="55" width="740" height="270" rx="20" fill="#0f172a" fill-opacity="0.82" stroke="url(#card-border)" stroke-width="1.5" />

    <!-- Top Status Pill -->
    <g>
      <rect x="490" y="78" width="220" height="28" rx="14" fill="#1e1b4b" stroke="#6366f1" stroke-width="1" stroke-opacity="0.6" />
      <circle cx="506" cy="92" r="4.5" fill="#22c55e" />
      <text x="606" y="97" fill="#c7d2fe" font-size="12" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" text-anchor="middle">CURATED AWESOME LIST</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="160" text-anchor="middle" fill="url(#title-grad)" class="title-text" font-size="40">Awesome PKM</text>
    <text x="600" y="196" text-anchor="middle" fill="#f8fafc" class="title-text" font-size="22" opacity="0.95">Personal Knowledge Management</text>

    <!-- Subtitle -->
    <text x="600" y="234" text-anchor="middle" fill="#94a3b8" class="sub-text" font-size="15">
      The definitive ecosystem of SaaS workspaces, local-first second brains,
    </text>
    <text x="600" y="256" text-anchor="middle" fill="#94a3b8" class="sub-text" font-size="15">
      bidirectional outliners, and self-hosted open-source software.
    </text>

    <!-- Bottom Feature Tags inside Foreground -->
    <g transform="translate(285, 278)">
      <!-- Tag 1 -->
      <rect x="0" y="0" width="112" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="56" y="17" fill="#cbd5e1" font-size="11.5" font-family="sans-serif" font-weight="500" text-anchor="middle">✨ SaaS &amp; Cloud</text>

      <!-- Tag 2 -->
      <rect x="122" y="0" width="128" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="186" y="17" fill="#cbd5e1" font-size="11.5" font-family="sans-serif" font-weight="500" text-anchor="middle">🔓 Open-Source</text>

      <!-- Tag 3 -->
      <rect x="260" y="0" width="118" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="319" y="17" fill="#cbd5e1" font-size="11.5" font-family="sans-serif" font-weight="500" text-anchor="middle">🛡️ Local-First</text>

      <!-- Tag 4 -->
      <rect x="388" y="0" width="116" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="446" y="17" fill="#cbd5e1" font-size="11.5" font-family="sans-serif" font-weight="500" text-anchor="middle">🔗 Bi-Directional</text>

      <!-- Tag 5 -->
      <rect x="514" y="0" width="116" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="572" y="17" fill="#cbd5e1" font-size="11.5" font-family="sans-serif" font-weight="500" text-anchor="middle">📝 Markdown</text>
    </g>
  </g>
</svg>